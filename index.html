        if (pending?.verified) { authStep = 'password'; render(); }
        else if (form.isConnected) {
          form.parentElement.querySelector('[role="alert"]')?.remove();
          const alert = document.createElement('div'); alert.setAttribute('role','alert'); alert.className = 'rounded-xl border border-red-400/30 bg-red-400/5 p-4 mb-5 text-sm text-red-200 whitespace-pre-wrap'; alert.textContent = messageText(authError); form.before(alert);
        } else render();
      } else if ((isCredentials || isAdvert) && form.isConnected) {
        const alert = form.querySelector('[role="alert"]'); alert.textContent = messageText(error.message); alert.classList.remove('hidden'); alert.scrollIntoView({block:'nearest'});
      } else toast(error.message);
    } finally {
      if (isCredentials) clearCredentialFields(form);
      busy = false; form.removeAttribute('aria-busy'); if (button?.isConnected) { button.disabled = false; button.textContent = oldText; }
    }
  });
  // Public announcements and authenticated records refresh without any visible vendor/sync banner.
  const poll = setInterval(async () => {
    if (document.hidden || busy) return;
    void loadAdverts(); void loadMovingAdvert();
    if (authFlow || $('modal').open || !installPopup.classList.contains('hidden') || !authUser || !state) return;
    await sync(true); if (page === 'referral' && me()?.role !== 'admin') await loadReferrals();
  },10000);
  document.addEventListener('visibilitychange',() => {
    updateMovingPlayback(); captureMovingProgress();
    if (document.hidden || busy) return;
    void loadAdverts(); void loadMovingAdvert();
    if (!authFlow && !$('modal').open && authUser) void sync(true);
  });
  if (broadcast) broadcast.onmessage = e => {
    if (e.data?.type !== 'refresh' || busy) return;
    void loadAdverts(); void loadMovingAdvert();
    if (!authFlow && !$('modal').open && authUser) void sync(true);
  };
  const motionChanged = () => updateMovingPlayback();
  if (reducedMovingMotion.addEventListener) reducedMovingMotion.addEventListener('change',motionChanged);
  else reducedMovingMotion.addListener?.(motionChanged);
  window.addEventListener('storage',e => {
    if (e.key !== movingStorageKey || !e.newValue || !movingPlayback || movingPlayback.progress.done) return;
    try {
      const saved = JSON.parse(e.newValue);
      // Completing an advert in another tab also stops it here; ordinary refreshes never restart it.
      if (saved.id === movingPlayback.advert.id && saved.done === true) finishMovingPlayback(movingPlayback,['complete','reduced-motion','unavailable'].includes(saved.reason) ? saved.reason : 'complete');
    } catch (_) { /* Ignore unrelated or malformed browser storage events. */ }
  });
  window.addEventListener('pageshow',() => updateMovingPlayback());
  window.addEventListener('pagehide',e => {
    captureMovingProgress();
    if (!e.persisted) { stopMovingPlayback(); clearInterval(poll); broadcast?.close(); }
  });
  void initialize();
});
