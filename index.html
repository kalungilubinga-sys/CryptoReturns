let state;try{state=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch{state=structuredClone(seed)}

const icon=(n,extra='')=>`<i class="fa-solid fa-${n} ${extra}" aria-hidden="true"></i>`;

// Prototype accrual catches up complete 24-hour periods; production requires a protected server cron.
function accrue(){state.users.forEach(u=>{if(u.banned||!u.capital||!u.approved)return;const n=Math.floor((Date.now()-(u.lastAccrual||u.approved))/day);if(n>0){u.earnings=Math.round(((u.capital+u.earnings)*Math.pow(1.025,n)-u.capital)*100)/100;u.lastAccrual=(u.lastAccrual||u.approved)+n*day}});save()}

function auth(){ $('app').innerHTML=`<div class="max-w-7xl mx-auto px-5 md:px-10"><header class="py-7 flex justify-between items-center">${brand()}<span class="hidden sm:block text-sm text-muted">Built for a global community ${icon('globe','ml-2 text-gold')}</span></header><main id="main" class="grid lg:grid-cols-[1.15fr_1fr] items-center gap-12 lg:gap-24 py-8 lg:py-16"><section><div class="inline-flex items-center gap-2 rounded-full border border-gold/25 bg-gold/5 px-3 py-1.5 text-xs text-gold"><span class="w-1.5 h-1.5 rounded-full bg-gold"></span> YOUR CRYPTO. ONE CLEAR VIEW.</div><h1 class="font-display text-4xl sm:text-5xl xl:text-6xl font-extrabold tracking-tight leading-[1.15] mt-7">Your investment.<br>Your earnings.<br><span class="text-gold">Always in focus.</span></h1><p class="max-w-md text-muted leading-relaxed mt-6">A simple place to manage your investment requests, follow daily earnings, and stay connected. Wherever you call home.</p><div class="${card} p-5 mt-8 max-w-md relative overflow-hidden"><div class="flex justify-between text-xs text-muted"><span>PORTFOLIO PREVIEW</span><span class="text-gold">Sample data</span></div><div class="flex justify-between mt-5"><div><p class="text-xs text-muted">My investment</p><p class="font-display text-2xl font-bold mt-1">$500.00</p></div><div><p class="text-xs text-muted">Daily earnings</p><p class="font-display text-2xl font-bold mt-1 text-emerald-400">$128.45</p></div></div><svg viewBox="0 0 400 95" class="w-full h-24 mt-4" role="img" aria-label="Illustrative increasing earnings curve, not actual performance"><defs><linearGradient id="previewFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5be4f" stop-opacity=".22"/><stop offset="100%" stop-color="#f5be4f" stop-opacity="0"/></linearGradient></defs><path d="M0 80L35 77L70 70L105 73L140 56L175 59L210 42L245 45L280 25L315 30L350 12L400 6V95H0Z" fill="url(#previewFill)"/><path d="M0 80L35 77L70 70L105 73L140 56L175 59L210 42L245 45L280 25L315 30L350 12L400 6" fill="none" stroke="#f5be4f" stroke-width="2.5"/></svg></div><p class="text-xs text-muted mt-6 max-w-md leading-relaxed">Crypto assets carry significant risk. A 2.5% daily calculation is a simulation, not a guaranteed return. Your capital may be lost.</p></section><section class="${card} p-6 sm:p-9"><div class="flex gap-5 border-b border-line mb-7"><button data-action="auth-mode" data-value="login" class="pb-4 text-sm ${authMode==='login'?'text-gold border-b-2 border-gold':'text-muted'}">Sign in</button><button data-action="auth-mode" data-value="signup" class="pb-4 text-sm ${authMode==='signup'?'text-gold border-b-2 border-gold':'text-muted'}">Create account</button></div><h2 class="font-display font-bold text-2xl">${authMode==='signup'?'Start your journey':'Welcome back'}</h2><p class="text-muted text-sm mt-2 mb-6">${authMode==='signup'?'Your account, wherever you are.':'Sign in to your Crypto Returns account.'}</p><form id="auth-form" class="space-y-4">${authMode==='signup'?`<label class="block text-sm">Full name<input required name="name" autocomplete="name" class="${input} mt-2" placeholder="Your full name"></label><label class="block text-sm">Country<select name="country" class="${input} mt-2">${countries()}</select></label><label class="block text-sm">Phone number<input required type="tel" name="phone" autocomplete="tel" class="${input} mt-2" placeholder="+256 700 000 000"></label><label class="block text-sm">Verify using<select id="verify-method" name="method" class="${input} mt-2"><option value="email">Email verification</option><option value="phone">Phone verification</option></select></label><label id="email-label" class="block text-sm">Email address<input type="email" name="email" required autocomplete="email" class="${input} mt-2" placeholder="you@example.com"></label>`:`<label class="block text-sm">Email or phone number<input required name="identity" autocomplete="username" class="${input} mt-2" placeholder="Email or international phone number"></label>`}<label class="block text-sm">Password<input type="password" name="password" minlength="8" required autocomplete="${authMode==='signup'?'new-password':'current-password'}" class="${input} mt-2" placeholder="At least 8 characters"></label>${authMode==='login'?`<div class="text-right"><button type="button" data-action="forgot" class="text-xs text-gold hover:underline">Forgot password?</button></div>`:''}<button class="${primary} w-full">${authMode==='signup'?'Create account':'Sign in'} ${icon('arrow-right','ml-2')}</button></form><div class="flex items-center gap-3 my-6 text-xs text-muted"><span class="h-px flex-1 bg-line"></span>EXPLORE THE PROTOTYPE<span class="h-px flex-1 bg-line"></span></div><div class="grid grid-cols-2 gap-3"><button data-action="demo-user" class="${secondary}">User demo ${icon('arrow-up-right-from-square','ml-1 text-xs')}</button><button data-action="demo-admin" class="${secondary}">Admin demo ${icon('arrow-up-right-from-square','ml-1 text-xs')}</button></div><p class="text-[11px] text-muted leading-relaxed mt-5">Verification is simulated; no emails or SMS are sent. Live phone verification requires a configured SMS provider. Do not use a real password in this demo.</p></section></main><footer class="border-t border-line py-6 text-xs text-muted flex justify-between"><span>© ${new Date().getFullYear()} Crypto Returns</span><span>USDT · BEP20 · TRC20</span></footer></div>`}

class="hidden sm:inline text-xs text-muted">${icon('globe','mr-2')}${esc(names.of(u.country))} <span class="mx-2 text-line">|</span> USD</span><button data-action="nav" data-value="account" aria-label="Open messages" class="relative h-9 w-9 rounded-xl border border-line hover:bg-white/5">${icon('bell')}${dot(u)?'<span class="absolute right-1.5 top-1 h-1.5 w-1.5 bg-gold rounded-full"></span>':''}</button><span class="grid place-items-center w-9 h-9 rounded-full bg-gold/15 text-gold text-xs font-bold">${esc(u.name.split(' ').map(n=>n[0]).join('').slice(0,2))}</span></div></header>${admin?`<nav class="lg:hidden flex gap-2 overflow-x-auto px-5 pt-4">${nav.map(n=>`<button class="shrink-0 px-3 py-2 rounded-lg text-sm ${page===n[0]?'bg-gold text-ink':'border border-line'}" data-action="nav" data-value="${n[0]}">${n[2]}</button>`).join('')}</nav>`:''}<main id="main" class="max-w-[1440px] mx-auto px-5 md:px-8 lg:px-10 pt-8 pb-28 lg:pb-8">${content(u)}</main><footer class="hidden lg:flex border-t border-line px-10 py-5 text-[11px] text-muted justify-between"><span>© ${new Date().getFullYear()} Crypto Returns</span><span>Demo calculations only · No guaranteed returns</span></footer></div></div>${!admin?`<nav aria-label="Main navigation" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-[#0c111d] border-t border-line flex justify-around px-1 pt-3 pb-5">${userNav.map(n=>`<button data-action="nav" data-value="${n[0]}" class="w-1/5 flex flex-col items-center gap-1.5 text-[10px] ${page===n[0]?'text-gold':'text-muted'}">${icon(n[1],'text-base')}<span>${n[2]}</span></button>`).join('')}</nav>`:''}`}
function heading(title,sub,extra=''){return `<div class="flex flex-wrap items-center justify-between gap-4 mb-7"><div><h1 class="font-display text-2xl md:text-3xl font-bold tracking-tight">${title}</h1><p class="text-sm text-muted mt-2">${sub}</p></div>${extra}</div>`}

function chart(u){const points=Array.from({length:15},(_,i)=>{const b=(u.capital||500);return 110-(b*Math.pow(1.025,i)-b)/(b*Math.pow(1.025,14)-b)*88});const path=points.map((y,i)=>`${i?'L':'M'}${i*40} ${y.toFixed(1)}`).join(' ');return `<svg viewBox="0 0 560 145" class="w-full h-44 mt-7" role="img" aria-label="Illustrative 14-day compound earnings projection, not historical performance"><defs><linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5be4f" stop-opacity=".18"/><stop offset="1" stop-color="#f5be4f" stop-opacity="0"/></linearGradient></defs><path d="M0 25H560M0 65H560M0 105H560" stroke="#242c3c" stroke-dasharray="4 5"/><path d="${path}L560 145H0Z" fill="url(#chartfill)"/><path d="${path}" stroke="#f5be4f" stroke-width="2.5" fill="none"/></svg><div class="flex justify-between text-[10px] text-muted"><span>Day 1</span><span>Day 7</span><span>Day 14</span></div>`}
function home(u){return heading(`Welcome back, ${esc(u.name.split(' ')[0])}<span class="text-gold">.</span>`,'Here’s your investment at a glance.',`<button data-action="nav" data-value="invest" class="${primary}">${icon('plus','mr-2')}New investment</button>`)+`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"><section class="${card} p-6 relative overflow-hidden"><div class="absolute right-0 top-0 h-28 w-28 rounded-full bg-gold/5 blur-2xl"></div><div class="flex justify-between items-center"><span class="text-sm text-muted">My investment</span><span class="w-10 h-10 rounded-xl grid place-items-center bg-gold/10 text-gold">${icon('layer-group')}</span></div><p class="font-display text-4xl font-bold tracking-tight mt-5">${money(u.capital)}</p><div class="flex items-center gap-2 mt-5 text-xs text-muted"><span class="w-1.5 h-1.5 bg-gold rounded-full"></span>Capital balance <span class="ml-auto border border-line rounded px-2 py-1">Constant</span></div></section><section class="${card} p-6"><div class="flex justify-between items-center"><span class="text-sm text-muted">My daily earnings</span><span class="w-10 h-10 rounded-xl grid place-items-center bg-emerald-400/10 text-emerald-400">${icon('arrow-trend-up')}</span></div><p class="font-display text-4xl font-bold tracking-tight mt-5 text-emerald-400">${money(u.earnings)}</p><div class="mt-5 flex justify-between items-center text-xs text-muted"><span>Separate from your capital</span><span class="bg-emerald-400/10 text-emerald-300 rounded px-2 py-1">Compounding</span></div></section><section class="${card} p-6 md:col-span-2 xl:col-span-1"><div class="flex justify-between items-center"><span class="text-sm text-muted">Next daily calculation</span><span class="w-10 h-10 rounded-xl grid place-items-center bg-blue-400/10 text-blue-300">${icon('clock')}</span></div><p class="font-display text-4xl font-bold tracking-tight mt-5">${money(u.capital?(u.capital+u.earnings)*.025:0)}</p><div class="flex items-center justify-between mt-5 text-xs"><span class="text-muted">${days(u)} days active</span><span class="text-blue-300">2.5% / day · simulated</span></div></section></div><div class="grid xl:grid-cols-[1.65fr_1fr] gap-5 mt-6"><section class="${card} p-6"><div class="flex justify-between items-start"><div><h2 class="font-display font-semibold">Earnings outlook</h2><p class="text-xs text-muted mt-1.5">Illustrative projection · not actual performance</p></div><span class="text-xs border border-line px-3 py-1.5 rounded-lg">14 days</span></div>${chart(u)}<div class="flex gap-4 mt-5 text-[11px] text-muted"><span><span class="inline-block w-2 h-2 bg-gold rounded-full mr-1"></span>Compound calculation</span><span>Calculated on capital + earnings</span></div></section><section class="${card} p-6"><span class="text-[10px] text-gold tracking-[.18em]">GROW YOUR COMMUNITY</span><h2 class="font-display font-bold text-2xl mt-4">Good things are<br>better shared.</h2><p class="text-sm leading-relaxed text-muted mt-3">Invite a friend. You receive <span class="text-white">$5</span> and they receive <span class="text-white">$2.50</span> after their first approved deposit.</p><div class="flex -space-x-2 my-5">${['AM','SW','JK'].map((n,i)=>`<span class="grid place-items-center w-9 h-9 border-2 border-panel rounded-full ${['bg-violet-900 text-violet-200','bg-teal-900 text-teal-200','bg-amber-900 text-amber-200'][i]} text-[10px]">${n}</span>`).join('')}<span class="pl-5 pt-2 text-xs text-muted">Your next connection starts here</span></div><button data-action="nav" data-value="referral" class="${secondary} w-full text-gold">Invite a friend ${icon('arrow-right','ml-2')}</button></section></div><section class="${card} mt-6"><div class="flex justify-between p-6 border-b border-line"><h2 class="font-display font-semibold">Recent activity</h2><button data-action="nav" data-value="withdraw" class="text-xs text-gold">View requests ${icon('arrow-right','ml-1')}</button></div>${activity(u)}</section><div class="flex items-start gap-3 rounded-xl bg-white/[.02] px-4 py-4 mt-5 text-xs text-muted leading-relaxed">${icon('circle-info','mt-0.5 text-gold')}<p>All amounts are in USD equivalents. The daily rate is a requested prototype rule, not a promise of profit. Crypto investment is high risk.</p></div>`}
function activity(u){const a=[...state.deposits.filter(d=>d.userId===u.id).map(d=>({...d,type:'Deposit'})),...state.withdrawals.filter(d=>d.userId===u.id).map(d=>({...d,type:d.type==='daily'?'Daily withdrawal':'Capital withdrawal'}))].sort((a,b)=>b.date-a.date).slice(0,6);return a.length?a.map(d=>`<div class="flex items-center justify-between gap-3 px-6 py-4 border-b border-line last:border-0"><div class="flex gap-3 items-center"><span class="w-9 h-9 bg-white/5 rounded-lg grid place-items-center text-gold">${icon(d.type==='Deposit'?'arrow-down':'arrow-up')}</span><div><p class="text-sm">${d.type}</p><p class="text-xs text-muted mt-1">${d.network} · ${date(d.date)}</p></div></div><div class="text-right"><p class="text-sm mb-1">${money(d.amount)}</p>${badge(d.status)}</div></div>`).join(''):empty('No transactions yet. Your requests will appear here.')}
function warning(){return `<div class="border border-red-400/25 bg-red-400/5 rounded-xl p-4 mb-6"><p class="text-red-300 text-sm font-semibold">${icon('triangle-exclamation','mr-2')}Wrong network = Money LOST forever. No refund.</p><p class="mt-2 text-xs text-muted">Choose BSC only if your wallet says BSC / BEP20 (0x…). Choose TRX only if your wallet says TRX / TRC20 (T…). Only USDT.</p><p class="text-xs text-gold mt-2">Prototype only: do not transfer funds to these addresses.</p></div>`}
function networkButtons(){return `<div class="grid sm:grid-cols-2 gap-3">${[['BSC','BNB Smart Chain','BEP20 · address starts with 0x'],['TRX','Tron','TRC20 · address starts with T']].map(([n,t,s])=>`<button type="button" data-action="network" data-value="${n}" class="text-left rounded-xl border p-4 ${network===n?'border-gold bg-gold/5':'border-line hover:border-slate-500'}"><div class="flex items-center justify-between"><span class="text-sm font-semibold">${n} <span class="text-muted font-normal ml-1">${t}</span></span>${network===n?icon('circle-check','text-gold'):icon('circle','text-muted')}</div><p class="text-xs text-muted mt-2">${s}</p></button>`).join('')}</div>`}
function invest(u){return heading('Make an investment','Choose your amount, select the correct network, and submit your proof.')+warning()+`<div class="grid xl:grid-cols-[1.65fr_1fr] gap-6"><section class="${card} p-6 sm:p-8"><h2 class="font-display font-semibold mb-4"><span class="text-gold mr-3">01</span>Choose your category</h2><div class="grid grid-cols-3 sm:grid-cols-6 gap-3 mb-8">${[50,100,200,500,800,1000].map(a=>`<button data-action="amount" data-value="${a}" class="rounded-xl border px-2 py-4 text-sm font-bold ${depositAmount===a?'border-gold bg-gold/10 text-gold':'border-line hover:border-slate-500'}">$${a.toLocaleString()}</button>`).join('')}</div><h2 class="font-display font-semibold mb-4"><span class="text-gold mr-3">02</span>Choose your crypto network</h2>${networkButtons()}<div class="h-px bg-line my-8"></div><h2 class="font-display font-semibold mb-4"><span class="text-gold mr-3">03</span>Address & transaction proof</h2>${ack?`<label class="text-sm block">${network} deposit address</label><div class="flex gap-2 mt-2"><input readonly aria-label="Deposit wallet address" class="${input} font-mono text-xs" value="${esc(state.wallets[network])}"><button data-action="copy-wallet" class="${secondary}" aria-label="Copy deposit address">${icon('copy')}</button></div><p class="text-xs text-gold mt-3">Address shown for preview only. Do not send real funds.</p><form id="deposit-form" class="mt-5"><label class="block text-sm">Transaction hash / proof<input required minlength="8" name="proof" class="${input} mt-2" placeholder="Paste a demo transaction hash"></label><button class="${primary} w-full mt-5">Submit deposit for review ${icon('arrow-right','ml-2')}</button></form>`:`<p class="text-muted text-sm mb-4">Confirm the network safety notice before viewing an address.</p><button data-action="ack" class="${primary}">Review network safety ${icon('arrow-right','ml-2')}</button>`}</section><aside class="space-y-5"><section class="${card} p-6"><h2 class="font-display font-semibold mb-5">Investment summary</h2><div class="space-y-4 text-sm"><p class="flex justify-between text-muted">Category <span class="text-white">${money(depositAmount)}</span></p><p class="flex justify-between text-muted">Network <span class="text-white">${network} / ${network==='BSC'?'BEP20':'TRC20'}</span></p><p class="flex justify-between text-muted">Starting daily calculation <span class="text-gold">${money(depositAmount*.025)}</span></p><p class="flex justify-between text-muted">Status after submission ${badge('pending')}</p></div><p class="text-xs text-muted leading-relaxed border-t border-line mt-5 pt-5">Capital appears after admin approval. Daily calculations use capital plus available earnings. The rate is simulated and not guaranteed.</p></section><section class="${card} p-6"><h2 class="font-display font-semibold">Your deposit requests</h2>${state.deposits.filter(d=>d.userId===u.id).map(d=>`<div class="flex justify-between items-center border-b border-line last:border-0 py-4 text-sm"><div>${money(d.amount)}<p class="text-xs text-muted mt-1">${d.network} · ${date(d.date)}</p></div>${badge(d.status)}</div>`).join('')||empty('No deposit requests yet.')}</section></aside></div>`}
function withdraw(u){const capital=withdrawType==='capital',rate=capital?(days(u)<=45?.5:.35):.15;return heading(capital?'Apply for capital withdrawal':'Withdraw daily earnings','Review your network, fees, and available balance before submitting.')+warning()+`<div class="grid xl:grid-cols-[1.65fr_1fr] gap-6"><section class="${card} p-6 sm:p-8"><div class="flex gap-3 mb-7"><button data-action="withdraw-type" data-value="daily" class="${withdrawType==='daily'?primary:secondary}">Daily earnings</button><button data-action="withdraw-type" data-value="capital" class="${withdrawType==='capital'?primary:secondary}">Capital application</button></div><h2 class="font-display font-semibold mb-4">Choose your crypto network</h2>${networkButtons()}${!ack?`<button data-action="ack" class="${primary} mt-6">Review network safety ${icon('arrow-right','ml-2')}</button>`:`<form id="withdraw-form" class="space-y-5 mt-6"><label class="block text-sm">Paste your ${network} address<input required name="address" class="${input} mt-2 font-mono" placeholder="${network==='BSC'?'0x…':'T…'}" pattern="${network==='BSC'?'0x[a-fA-F0-9]{40}':'T[1-9A-HJ-NP-Za-km-z]{33}'}"></label><label class="block text-sm">Amount (USD)<input id="withdraw-amount" name="amount" type="number" step="0.01" min="${capital?'0.01':'10'}" max="${capital?u.capital:u.earnings}" value="${capital?u.capital:''}" ${capital?'readonly':''} required class="${input} mt-2" placeholder="Minimum $10"></label><div class="bg-ink rounded-xl p-4 space-y-3 text-sm"><p class="flex justify-between text-muted">Withdrawal charge (${rate*100}%)<span id="fee">${money(capital?u.capital*rate:0)}</span></p><p class="flex justify-between font-semibold">You receive<span id="net" class="text-gold">${money(capital?u.capital*(1-rate):0)}</span></p></div><p class="text-xs text-muted">${capital?'Full capital is removed and daily accrual stops only after approval.':'The full requested amount, including the fee, is deducted only after approval.'}</p><button class="${primary} w-full" ${capital?!u.capital?'disabled':'':u.earnings<10?'disabled':''}>Submit withdrawal request ${icon('arrow-right','ml-2')}</button></form>`}</section><aside class="space-y-5"><section class="${card} p-6"><p class="text-sm text-muted">Available ${capital?'capital':'daily earnings'}</p><p class="font-display font-bold text-3xl mt-3">${money(capital?u.capital:u.earnings)}</p><div class="border-t border-line mt-5 pt-5 space-y-3 text-xs text-muted"><p>${capital?`Days active: ${days(u)} · approved ${date(u.approved)}`:'Minimum daily earnings withdrawal: $10'}</p><p>${capital?'Within 45 days: 50% charge. After 45 days: 35% charge.':'Daily earnings withdrawal charge: 15%.'}</p><p>All requests require admin review.</p></div></section><section class="${card} p-6"><h2 class="font-display font-semibold">Withdrawal requests</h2>${state.withdrawals.filter(w=>w.userId===u.id).map(w=>`<div class="py-4 border-b border-line last:border-0 flex justify-between gap-3"><div class="text-sm">${money(w.amount)} · ${w.type}<p class="text-xs text-muted mt-1">Net ${money(w.net)} · ${w.network}</p></div>${badge(w.status)}</div>`).join('')||empty('No withdrawal requests yet.')}</section></aside></div>`}
function referral(u){const friends=state.users.filter(f=>f.referrer===u.id),link=location.origin+location.pathname+'?ref='+encodeURIComponent(u.id);return heading('Share the opportunity','Invite friends and track rewards after their first deposit is approved.')+`<div class="grid md:grid-cols-3 gap-5">${[['Invited friends',friends.length],['Approved referrals',friends.filter(f=>f.referralPaid).length],['Referral rewards',money(friends.filter(f=>f.referralPaid).length*5)]].map(([l,v])=>`<section class="${card} p-6"><p class="text-sm text-muted">${l}</p><p class="text-3xl font-display font-bold mt-3">${v}</p></section>`).join('')}</div><section class="${card} p-6 sm:p-8 mt-6"><span class="text-gold text-xs tracking-widest">INVITE. CONNECT. EARN.</span><h2 class="font-display font-bold text-2xl mt-3">You get $5. They get $2.50.</h2><p class="text-muted text-sm mt-3">Rewards are credited to daily earnings once, after their first approved deposit.</p><label class="block text-sm mt-6">Your unique referral link</label><div class="flex gap-3 mt-2"><input readonly class="${input} text-xs" value="${esc(link)}"><button data-action="copy-referral" class="${primary}">${icon('copy','mr-2')}Copy</button></div></section><section class="${card} p-6 mt-6"><h2 class="font-semibold mb-4">Your invitations</h2>${friends.map(f=>`<div class="flex justify-between gap-3 py-4 border-b border-line last:border-0"><div><p class="text-sm">${esc(f.name)}</p><p class="text-xs text-muted mt-1">Joined ${date(f.joined)}</p></div>${badge(f.referralPaid?'approved':'pending')}</div>`).join('')||empty('No invitations yet. Copy your link to get started.')}</section>`}
function messageCard(m,admin){const u=state.users.find(u=>u.id===m.userId);return `<article class="${card} p-5 mb-4"><div class="flex justify-between gap-3 mb-3"><div><h3 class="text-sm font-semibold">${esc(u.name)} ${u.banned?badge('banned'):''}</h3><p class="text-xs text-muted mt-1">${esc(u.phone)} · ${when(m.date)}</p>${admin?`<p class="text-xs text-muted mt-2">Investment ${money(u.capital)} · ${days(u)} days active</p>`:''}</div>${admin?banButton(u):''}</div><p class="text-sm leading-relaxed whitespace-pre-wrap">${esc(m.text)}</p>${m.reply?`<div class="bg-gold/5 border-l-2 border-gold p-4 mt-4"><p class="text-xs text-gold mb-2">Admin reply</p><p class="text-sm whitespace-pre-wrap">${esc(m.reply)}</p></div>`:admin?`<form data-reply="${m.id}" class="flex gap-2 mt-4"><input required name="reply" maxlength="2000" aria-label="Reply to ${esc(u.name)}" class="${input}" placeholder="Reply to this user…"><button class="${primary}">Reply</button></form>`:'<p class="text-xs text-muted mt-4">Waiting for admin reply</p>'}</article>`}
function account(u){if(u.role==='admin')return heading('Customer care','Private conversations with your users.')+searchBox('Search names, phones, or messages')+state.messages.filter(m=>{const f=state.users.find(f=>f.id===m.userId);return matches(f.name+' '+f.phone+' '+m.text)}).map(m=>messageCard(m,true)).join('');return heading('Account & support','Manage your profile and connect with customer care.',`<button data-action="logout" class="${secondary}">${icon('right-from-bracket','mr-2')}Sign out</button>`)+`<div class="grid xl:grid-cols-[1fr_1.5fr] gap-6"><section class="${card} p-6 h-fit"><h2 class="font-semibold mb-5">Your account</h2><form id="profile-form" class="space-y-4"><label class="block text-sm">Full name<input name="name" required value="${esc(u.name)}" class="${input} mt-2"></label><label class="block text-sm">Country<select name="country" class="${input} mt-2">${countries(u.country)}</select></label><p class="text-xs text-muted">${esc(u.phone)}<br>${esc(u.email||'Phone verification account')}<br>Joined ${date(u.joined)}</p><button class="${primary}">Save profile</button></form><button data-action="capital" class="${secondary} w-full mt-6 text-gold">Apply for Withdrawal ${icon('arrow-right','ml-2')}</button></section><section><div class="${card} p-6 mb-5"><h2 class="font-semibold">Message Admin</h2><p class="text-muted text-sm mt-2">Replies are visible only in your account.</p><form id="message-form" class="mt-4"><label class="sr-only" for="message-text">Your message</label><textarea id="message-text" name="text" required maxlength="2000" rows="4" class="${input}" placeholder="How can we help?"></textarea><button class="${primary} mt-3">Submit message ${icon('paper-plane','ml-2')}</button></form></div>${state.messages.filter(m=>m.userId===u.id).map(m=>messageCard(m,false)).join('')}</section></div>`}
function searchBox(placeholder){return `<label class="flex items-center gap-3 ${card} px-4 mb-6">${icon('magnifying-glass','text-muted')}<input id="search" value="${esc(search)}" aria-label="${placeholder}" placeholder="${placeholder}" class="bg-transparent py-3.5 text-sm outline-none w-full"></label>`}
const matches=text=>text.toLowerCase().includes(search.toLowerCase());
function banButton(u){return `<button data-action="ban" data-id="${u.id}" class="rounded-lg border ${u.banned?'border-emerald-400/30 text-emerald-300':'border-red-400/30 text-red-300'} px-3 py-2 text-xs hover:bg-white/5 whitespace-nowrap">${u.banned?'Unban User':'Ban User'}</button>`}

function depositCard(d){const u=state.users.find(u=>u.id===d.userId);return `<article class="${card} p-5 mb-4"><div class="flex justify-between items-start"><div><h3 class="font-semibold">${esc(u.name)} ${u.banned?badge('banned'):''}</h3><p class="text-xs text-muted mt-1">${esc(u.phone)} · ${when(d.date)}</p></div>${banButton(u)}</div><div class="flex gap-5 mt-5 items-center"><p class="text-2xl font-bold">${money(d.amount)}</p><span class="text-sm text-gold">${d.network}</span>${badge(d.status)}</div><p class="font-mono break-all text-xs bg-ink p-3 rounded-lg mt-4">Proof: ${esc(d.proof)}</p><div class="flex gap-3 mt-4"><button data-action="approve-deposit" data-id="${d.id}" class="${primary}">Approve</button><button data-action="reject-deposit" data-id="${d.id}" class="${secondary}">Reject</button></div></article>`}
function withdrawalCard(w){const u=state.users.find(u=>u.id===w.userId),inviter=state.users.find(f=>f.id===u.referrer),past=state.withdrawals.filter(h=>h.userId===u.id&&h.type==='daily'&&h.status==='approved'&&h.id!==w.id);return `<article class="${card} p-6 mb-5"><div class="flex justify-between items-start gap-3"><div><p class="text-[10px] tracking-widest text-gold mb-2">A. USER DETAILS</p><h3 class="font-display font-bold text-lg">${esc(u.name)} ${u.banned?badge('banned'):''}</h3><p class="text-xs text-muted mt-2">Phone: ${esc(u.phone)} · Joined: ${date(u.joined)}</p><p class="text-xs text-muted mt-2">Invitor: ${inviter?esc(inviter.name)+' · '+esc(inviter.phone):'No Invitor / Direct'}</p></div>${banButton(u)}</div><div class="border-t border-line mt-5 pt-5"><p class="text-[10px] tracking-widest text-gold mb-3">B. INVESTMENT DETAILS</p><div class="grid sm:grid-cols-3 gap-4 text-sm"><div><p class="text-xs text-muted">Capital invested</p><p class="mt-1">${money(u.capital)}</p></div><div><p class="text-xs text-muted">Current daily earnings</p><p class="mt-1 text-emerald-300">${money(u.earnings)}</p></div><div><p class="text-xs text-muted">Days active since approval</p><p class="mt-1">${days(u)}</p></div></div></div><div class="border-t border-line mt-5 pt-5"><p class="text-[10px] tracking-widest text-gold mb-3">C. THIS WITHDRAWAL REQUEST</p><div class="grid sm:grid-cols-2 gap-3 text-sm"><p><span class="text-muted">Type:</span> ${w.type==='daily'?'Daily Earnings':'Capital'}</p><p><span class="text-muted">Network:</span> ${w.network}</p><p><span class="text-muted">Requested:</span> ${money(w.amount)}</p><p><span class="text-muted">Charge (${Math.round(w.fee/w.amount*100)}%):</span> ${money(w.fee)}</p><p class="text-gold font-bold">Net to pay: ${money(w.net)}</p><p class="text-xs text-muted">${when(w.date)}</p></div><p class="text-xs text-muted mt-4">User wallet address</p><div class="flex gap-2 mt-2"><p class="font-mono break-all text-xs bg-ink p-3 rounded-lg flex-1">${esc(w.address)}</p><button class="${secondary}" data-action="copy-value" data-value="${esc(w.address)}" aria-label="Copy withdrawal address">${icon('copy')}</button></div></div><div class="border-t border-line mt-5 pt-5"><p class="text-[10px] tracking-widest text-gold mb-3">D. TOTAL DAILY WITHDRAWAL HISTORY</p><p class="text-xs text-muted">${past.length} previously approved · Total requested ${money(past.reduce((s,p)=>s+p.amount,0))}</p>${past.length?`<ul class="mt-3 space-y-2 text-xs">${past.map(p=>`<li>${date(p.processed||p.date)} · ${money(p.amount)} requested · ${money(p.net)} net paid</li>`).join('')}</ul>`:'<p class="text-xs text-muted mt-2">No previously approved daily withdrawals.</p>'}</div><div class="border-t border-line mt-5 pt-5"><p class="text-[10px] tracking-widest text-gold mb-3">E. ADMIN ACTIONS</p><div class="flex gap-3"><button data-action="approve-withdrawal" data-id="${w.id}" class="${primary}">Approve</button><button data-action="reject-withdrawal" data-id="${w.id}" class="${secondary}">Reject</button></div><p class="text-xs text-muted mt-3">Approval updates simulated balances. It does not transfer cryptocurrency.</p></div></article>`}
function adminHome(){const users=state.users.filter(u=>u.role!=='admin'),pd=state.deposits.filter(d=>d.status==='pending'),pw=state.withdrawals.filter(w=>w.status==='pending');return heading('Platform overview','Review requests and keep your community moving.',`<span class="text-xs border border-line rounded-lg px-3 py-2 text-muted">${icon('calendar','mr-2')}${date(Date.now())}</span>`)+`<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">${[['Total users',users.length,'users'],['Total capital',money(users.reduce((s,u)=>s+u.capital,0)),'layer-group'],['Total daily earnings',money(users.reduce((s,u)=>s+u.earnings,0)),'chart-line'],['Pending deposits',pd.length,'arrow-down'],['Pending withdrawals',pw.length,'arrow-up'],['Pending messages',state.messages.filter(m=>!m.reply).length,'comment']].map(([l,v,i])=>`<section class="${card} p-6"><div class="flex justify-between text-muted text-sm">${l}${icon(i,'text-gold')}</div><p class="font-display text-3xl font-bold mt-4">${v}</p></section>`).join('')}</div><div class="grid xl:grid-cols-2 gap-6 mt-7"><section><h2 class="font-display font-semibold mb-4">Pending deposits <span class="text-muted text-xs ml-2">${pd.length}</span></h2>${pd.map(depositCard).join('')||`<div class="${card}">${empty('No pending deposits.')}</div>`}</section><section><h2 class="font-display font-semibold mb-4">Pending withdrawals <span class="text-muted text-xs ml-2">${pw.length}</span></h2>${pw.map(withdrawalCard).join('')||`<div class="${card}">${empty('All caught up. No pending withdrawals.')}</div>`}</section></div>`}
function content(u){if(u.role!=='admin')return ({home,invest,withdraw,referral,account}[page]||home)(u);switch(page){case'home':return adminHome();case'users':return heading('Users management','Balances, referrals, and access controls.')+searchBox('Search users by name or phone')+`<div class="grid xl:grid-cols-2 gap-5">${state.users.filter(f=>f.role!=='admin'&&matches(f.name+' '+f.phone)).map(userCard).join('')||empty('No matching users.')}</div>`;case'deposits':return heading('Pending deposits','Review proof before approving capital.')+searchBox('Search depositor name, phone, or proof')+state.deposits.filter(d=>{const f=state.users.find(f=>f.id===d.userId);return d.status==='pending'&&matches(f.name+' '+f.phone+' '+d.proof)}).map(depositCard).join('')+(state.deposits.some(d=>d.status==='pending')?'':empty('No pending deposits.'));case'withdrawals':return heading('Pending withdrawals','Processed requests disappear immediately and move to History.')+searchBox('Search name, phone, or wallet address')+state.withdrawals.filter(w=>{const f=state.users.find(f=>f.id===w.userId);return w.status==='pending'&&matches(f.name+' '+f.phone+' '+w.address)}).map(withdrawalCard).join('')+(state.withdrawals.some(w=>w.status==='pending')?'':empty('No pending withdrawals.'));case'account':return account(u);case'referral':return heading('Referral tracking','Rewards are applied once, at first deposit approval.')+searchBox('Search invited users or phone numbers')+`<div class="grid xl:grid-cols-2 gap-5">${state.users.filter(f=>f.referrer&&matches(f.name+' '+f.phone)).map(userCard).join('')||empty('No matching referrals.')}</div>`;case'history':{const entries=[...state.deposits.map(d=>({...d,kind:'Deposit'})),...state.withdrawals.map(w=>({...w,kind:w.type+' withdrawal'}))].filter(r=>r.status!=='pending').sort((a,b)=>(b.processed||b.date)-(a.processed||a.date));return heading('Request history','Archive of approved and rejected requests.')+searchBox('Search user names or request types')+`<section class="${card} p-5">${entries.filter(r=>matches(state.users.find(f=>f.id===r.userId).name+' '+r.kind)).map(r=>`<div class="border-b border-line last:border-0 py-4 flex justify-between gap-4"><div><p class="text-sm">${esc(state.users.find(f=>f.id===r.userId).name)} · ${esc(r.kind)}</p><p class="text-xs text-muted mt-1">${when(r.processed||r.date)} · ${r.network} · ${money(r.amount)}${r.net!=null?' · Net '+money(r.net):''}</p></div>${badge(r.status)}</div>`).join('')||empty('No archived requests.')}</section>`}case'settings':return heading('Deposit wallet settings','Update the network-specific addresses displayed in deposit requests.')+`<section class="${card} p-6 max-w-3xl"><p class="text-sm text-gold mb-5">Demo only. Changes are stored in this browser, not Supabase.</p><form id="wallet-form" class="space-y-5">${['BSC','TRX'].map(n=>`<label class="block text-sm">${n} / ${n==='BSC'?'BEP20':'TRC20'} address<input required name="${n}" value="${esc(state.wallets[n])}" pattern="${n==='BSC'?'0x[a-fA-F0-9]{40}':'T[1-9A-HJ-NP-Za-km-z]{33}'}" class="${input} mt-2 font-mono"></label>`).join('')}<button class="${primary}">Save wallet addresses</button></form><div class="border-t border-line mt-6 pt-6 text-xs text-muted leading-relaxed">Real administration must use server-assigned roles, protected database policies, and atomic withdrawal approvals. Never store the supplied admin password in public frontend code.</div></section>`;default:return adminHome()}}
// Mock passwords are hashed for prototype storage, but browser state is not a security boundary.
async function hash(text,salt){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+text));return Array.from(new Uint8Array(bytes)).map(v=>v.toString(16).padStart(2,'0')).join('')}
function login(id){const u=state.users.find(u=>u.id===id);if(u?.banned)return toast('Your account has been banned. Contact Admin.');session=id;sessionStorage.setItem('crSession',id);page='home';search='';accrue();render()}
function normalize(s){return s.trim().toLowerCase().replace(/\s+/g,'')}
function openAck(){modal('Confirm your network',`<div class="border border-gold/30 rounded-xl p-4 bg-gold/5"><p class="font-semibold">You chose ${network} / ${network==='BSC'?'BEP20':'TRC20'}.</p><p class="text-sm text-muted leading-relaxed mt-3">Select the SAME network in your sending wallet. Only send USDT.</p><p class="text-red-300 text-sm mt-3">Wrong network = Money LOST forever. No refund.</p></div><p class="text-xs text-gold mt-4">This is a prototype. Do not send real cryptocurrency.</p><button data-action="understand" class="${primary} w-full mt-5">I Understand</button>`)}
function adminAction(action,id){if(me()?.role!=='admin')return;const isDeposit=action.includes('deposit'),list=isDeposit?state.deposits:state.withdrawals,r=list.find(r=>r.id===id);if(!r||r.status!=='pending')return;const u=state.users.find(u=>u.id===r.userId),approve=action.startsWith('approve');if(approve&&u.banned)return toast('Unban this user before approving their request.');if(approve){if(isDeposit){const wasActive=u.capital>0;u.capital+=r.amount;if(!wasActive){u.approved=Date.now();u.lastAccrual=Date.now()}if(!u.referralPaid&&u.referrer){const inv=state.users.find(f=>f.id===u.referrer);if(inv){inv.earnings+=5;u.earnings+=2.5;u.referralPaid=true}}}else{if(r.type==='daily'){if(u.earnings<r.amount)return toast('Insufficient current earnings. Reject or review this request.');u.earnings=Math.round((u.earnings-r.amount)*100)/100}else{if(Math.abs(u.capital-r.amount)>.005)return toast('Capital changed since submission. Reject this request and ask for a new application.');u.capital=0;u.approved=null;u.lastAccrual=null}}}r.status=approve?'approved':'rejected';r.processed=Date.now();save();render();toast(`${isDeposit?'Deposit':'Withdrawal'} ${r.status}.${!isDeposit&&approve?' Balance updated; request moved to History.':''}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;switch(a){case'auth-mode':authMode=v;auth();break;case'demo-user':login('demo');break;case'demo-admin':login('admin-demo');break;case'logout':session=null;sessionStorage.removeItem('crSession');auth();break;case'nav':page=v;search='';ack=false;if(page==='account'){state.messages.forEach(m=>{if(me().role==='admin')m.unreadAdmin=false;else if(m.userId===session)m.unreadUser=false});save()}render();window.scrollTo({top:0,behavior:'instant'});break;case'amount':depositAmount=Number(v);render();break;case'network':network=v;ack=false;render();break;case'ack':openAck();break;case'understand':ack=true;$('modal').close();render();break;case'copy-wallet':copy(state.wallets[network]);break;case'copy-value':copy(v);break;case'copy-referral':copy(location.origin+location.pathname+'?ref='+encodeURIComponent(session));break;case'withdraw-type':withdrawType=v;ack=false;render();break;case'capital':page='withdraw';withdrawType='capital';ack=false;render();break;case'ban':{if(me()?.role!=='admin')return;const u=state.users.find(u=>u.id===id);if(!u||u.role==='admin')return;modal(u.banned?'Restore user access?':'Ban this user?',`<p class="text-sm text-muted leading-relaxed">${esc(u.name)}: ${u.banned?'Restore access. Accrual resumes from now; banned days are not credited.':'Block access, deposits, withdrawals, messages, and daily accrual. Existing balances and history remain saved.'}</p><button class="${primary} mt-5" data-action="confirm-ban" data-id="${id}">${u.banned?'Unban User':'Ban User'}</button>`);break}case'confirm-ban':{if(me()?.role!=='admin')return;const u=state.users.find(u=>u.id===id);u.banned=!u.banned;u.lastAccrual=Date.now();save();$('modal').close();render();toast(u.banned?'User banned. Data retained.':'User access restored.');break}case'approve-deposit':case'reject-deposit':case'approve-withdrawal':case'reject-withdrawal':adminAction(a,id);break;case'forgot':modal('Password recovery (demo)',`<p class="text-sm text-muted mb-4">Choose email or phone. No message will be sent; use the displayed test code.</p><form id="recovery-form" class="space-y-4"><label class="block text-sm">Email or phone<input name="identity" required class="${input} mt-2" placeholder="Your account email or phone"></label><button class="${primary}">Continue</button></form>`);break}});
document.addEventListener('change',e=>{if(e.target.id==='verify-method'){const email=$('email-label');email.classList.toggle('hidden',e.target.value==='phone');email.querySelector('input').required=e.target.value==='email'}});
document.addEventListener('input',e=>{if(e.target.id==='withdraw-amount'){const u=me(),rate=withdrawType==='daily'?.15:days(u)<=45?.5:.35,v=Math.max(0,Number(e.target.value)||0);$('fee').textContent=money(v*rate);$('net').textContent=money(v*(1-rate))}if(e.target.id==='search'){search=e.target.value;const start=e.target.selectionStart;render();$('search')?.focus();$('search')?.setSelectionRange(start,start)}});
let pendingSignup=null,recoveryId=null;
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,fd=new FormData(f),u=me();try{if(f.id==='auth-form'){if(authMode==='login'){const identity=normalize(fd.get('identity')),found=state.users.find(u=>normalize(u.phone)===identity||normalize(u.email||'')===identity);if(found?.banned)return toast('Your account has been banned. Contact Admin.');if(!found?.passwordHash||await hash(fd.get('password'),found.salt)!==found.passwordHash)return toast('Account or password not recognized. Use a demo button to explore.');login(found.id)}else{const phone=normalize(fd.get('phone')),email=normalize(fd.get('email')||'');if(!/^\+[1-9]\d{6,14}$/.test(phone))return toast('Enter an international phone number beginning with + and country code.');if(state.users.some(u=>normalize(u.phone)===phone||(email&&normalize(u.email||'')===email)))return toast('An account already uses this phone or email.');const salt=uid();pendingSignup={id:uid(),name:fd.get('name').trim(),phone,email,country:fd.get('country'),salt,passwordHash:await hash(fd.get('password'),salt),role:'user',joined:Date.now(),capital:0,earnings:0,banned:false,referrer:new URLSearchParams(location.search).get('ref')};if(!pendingSignup.name)return toast('Enter a full name.');if(!state.users.some(u=>u.id===pendingSignup.referrer&&u.role==='user'))pendingSignup.referrer=null;modal('Verify your account (demo)',`<p class="text-sm text-muted">${fd.get('method')==='phone'?'Phone':'Email'} verification is simulated. No code was sent.</p><p class="bg-gold/10 text-gold rounded-xl p-4 mt-4 text-sm">Test code: <strong>123456</strong></p><form id="verify-form" class="mt-4"><label class="block text-sm">Verification code<input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" class="${input} mt-2" autocomplete="one-time-code"></label><button class="${primary} w-full mt-4">Verify & create account</button></form>`)}}else if(f.id==='verify-form'){if(fd.get('code')!=='123456')return toast('Enter the demo code 123456.');if(!pendingSignup)return;state.users.push(pendingSignup);save();$('modal').close();login(pendingSignup.id);pendingSignup=null;toast('Demo account created.')}else if(f.id==='recovery-form'){const identity=normalize(fd.get('identity'));const found=state.users.find(u=>normalize(u.phone)===identity||normalize(u.email||'')===identity);if(!found||found.role==='admin')return toast('Use a registered demo account for recovery.');if(found.banned)return toast('Your account has been banned. Contact Admin.');recoveryId=found.id;modal('Reset password (demo)',`<p class="text-xs text-gold mb-4">No message sent. Demo code: 123456</p><form id="reset-form" class="space-y-4"><label class="block text-sm">Demo verification code<input name="code" required class="${input} mt-2"></label><label class="block text-sm">New demo password<input name="password" type="password" required minlength="8" class="${input} mt-2"></label><button class="${primary}">Reset password</button></form>`)}else if(f.id==='reset-form'){if(fd.get('code')!=='123456')return toast('Enter the demo code 123456.');const found=state.users.find(u=>u.id===recoveryId);found.salt=uid();found.passwordHash=await hash(fd.get('password'),found.salt);save();$('modal').close();toast('Demo password reset. Sign in to continue.')}else{if(!u||u.banned)return toast('Your account has been banned. Contact Admin.');if(f.id==='deposit-form'){if(!ack)return;const proof=fd.get('proof').trim();if(proof.length<8)return toast('Enter a transaction proof of at least 8 non-whitespace characters.');state.deposits.push({id:uid(),userId:u.id,amount:depositAmount,network,proof,status:'pending',date:Date.now()});save();ack=false;render();toast('Deposit submitted. Awaiting admin approval.')}else if(f.id==='withdraw-form'){if(!ack)return;const amount=Math.round(Number(fd.get('amount'))*100)/100,capital=withdrawType==='capital',address=fd.get('address').trim(),valid=network==='BSC'?/^0x[a-fA-F0-9]{40}$/.test(address):/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address);if(!valid)return toast('Address format does not match the selected network.');if(!Number.isFinite(amount)||amount<=0)return toast('Enter a valid withdrawal amount.');const pending=state.withdrawals.filter(w=>w.userId===u.id&&w.status==='pending');if(capital&&(amount<=0||amount!==u.capital||pending.some(w=>w.type==='capital')))return toast('Submit only one full-capital application at a time.');if(!capital&&(amount<10||amount+pending.filter(w=>w.type==='daily').reduce((s,w)=>s+w.amount,0)>u.earnings))return toast('Minimum is $10. Amount exceeds unrequested available earnings.');const rate=capital?(days(u)<=45?.5:.35):.15,fee=Math.round(amount*rate*100)/100;state.withdrawals.push({id:uid(),userId:u.id,type:withdrawType,network,address,amount,fee,net:Math.round((amount-fee)*100)/100,date:Date.now(),status:'pending'});save();ack=false;render();toast('Withdrawal requested. Balance changes only after approval.')}else if(f.id==='message-form'){const text=fd.get('text').trim();if(!text)return;state.messages.push({id:uid(),userId:u.id,text,date:Date.now(),reply:'',unreadAdmin:true,unreadUser:false});save();render();toast('Message submitted to admin.')}else if(f.id==='profile-form'){if(!fd.get('name').trim())return;u.name=fd.get('name').trim();u.country=fd.get('country');save();render();toast('Profile updated.')}else if(f.id==='wallet-form'&&u.role==='admin'){state.wallets={BSC:fd.get('BSC').trim(),TRX:fd.get('TRX').trim()};save();toast('Demo deposit addresses updated.')}else if(f.dataset.reply&&u.role==='admin'){const m=state.messages.find(m=>m.id===f.dataset.reply);if(!fd.get('reply').trim())return;m.reply=fd.get('reply').trim();m.unreadUser=true;m.unreadAdmin=false;save();render();toast('Reply saved for this user.')}}}catch(err){console.error(err);toast('Unable to complete this action. Please try again.')}});
window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){try{state=JSON.parse(e.newValue);render()}catch{toast('Could not sync browser data.')}}});
setInterval(()=>{if(me()){accrue();if(page==='home')render()}},60000);
if(new URLSearchParams(location.search).has('ref'))authMode='signup';accrue();render();
});
</script>
