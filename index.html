  // All data reads are real Supabase queries. Paginate instead of silently truncating at 1,000 rows.
  async function rows(table, owner, order = 'id') {
    const result = [];

      let q = sb.from(table).select('*').order(order).range(from,from + 499);
      if (owner) q = q.eq('user_id',owner);
      const {data,error} = await q;
      if (error) throw new Error(`${table}: ${error.message}`);
      if (!Array.isArray(data)) throw new Error(`${table}: Supabase returned an invalid response.`);
      result.push(...data); if (data.length < 500) break;
    }
    return result;
  }

    return data;

        try {
          const response = error.context, text = await response.text(); let detail = text;
          try { const parsed = JSON.parse(text); detail = parsed.error || parsed.message || text; } catch (_) { /* Preserve the actual HTTP error. */ }
          message = `[HTTP ${response.status}] ${detail || message}`;
        } catch (_) { /* Use the SDK transport error if the response cannot be read. */ }
      }
      throw new Error(`${name}: ${message}`);
    }
    if (!data || data.error) throw new Error(data?.error || `${name}: Empty response from Supabase.`);
    return data;
  }

  async function sendPendingCode() {
    if (!pending || pending.method !== 'email' || !pending.target) throw new Error('Start email verification again.');
    if (settings?.external?.email === false) throw new Error('Email authentication is disabled in Supabase. Ask Admin to enable the Email provider.');
    const options = {shouldCreateUser:pending.kind === 'signup'};
    if (pending.kind === 'signup') { options.data = pending.metadata; options.emailRedirectTo = `${location.origin}${location.pathname}`; }
    // Supabase email templates must contain {{ .Token }} for code-only emails.
    const result = pending.kind === 'recovery'
      ? await sb.auth.resetPasswordForEmail(pending.target,{redirectTo:`${location.origin}${location.pathname}`})
      : await sb.auth.signInWithOtp({email:pending.target,options});
    if (result.error) throw new Error(result.error.message);
  }
  function openAck() {
    modal('Confirm your network',`<div class="border border-gold/30 rounded-xl p-4 bg-gold/5"><p class="font-semibold">You chose ${network} / ${network === 'BSC' ? 'BEP20' : 'TRC20'}.</p><p class="text-sm text-muted leading-relaxed mt-3">Select the SAME network in your ${page === 'invest' ? 'sending' : 'receiving'} wallet. Only ${page === 'invest' ? 'send' : 'receive'} USDT.</p><p class="text-red-300 text-sm mt-3">Wrong network = Money LOST forever. No refund.</p></div><button data-action="understand" class="${primary} w-full mt-5">I Understand</button>`);
  }
  function confirmFinancialAction(action,id) {
    if (me()?.role !== 'admin') throw new Error('Administrator access required.');
    const deposit = action.includes('deposit'), approve = action.startsWith('approve'), record = (deposit ? state.deposits : state.withdrawals).find(r => r.id === id);
    if (!record || record.status !== 'pending') throw new Error('This request is already processed or unavailable. Refresh your records.');
    modal(`${approve ? 'Approve' : 'Reject'} ${deposit ? 'deposit' : 'withdrawal'}?`, `<p class="text-sm text-muted leading-relaxed">${esc(findUser(record.user_id).name)} · ${money(record.amount)} · ${record.network}</p><p class="text-sm mt-4 leading-relaxed">${approve ? deposit ? 'Confirm that the USDT payment actually reached the correct deposit wallet. Approval credits capital in the database.' : `Approval deducts ${money(record.amount)} from ${record.type === 'daily' ? 'daily earnings' : 'capital'} and archives this request. ${record.type === 'capital' ? 'Daily compounding stops immediately.' : ''} The application does not send cryptocurrency.` : 'The request will move to History. No balance will be deducted or credited.'}</p><form id="process-form" data-operation="${action}" data-record="${id}" class="mt-5">${approve ? `<label class="flex gap-3 items-start text-sm text-muted mb-5"><input required type="checkbox" class="mt-1 accent-amber-400">${deposit ? 'I independently verified the payment on the correct blockchain.' : `I have independently paid and verified the net payout of ${money(record.net_amount)} to this user's wallet.`}</label>` : ''}<button class="${primary} w-full">${approve ? 'Confirm approval' : 'Confirm rejection'}</button></form>`);
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-action]'); if (!b || b.disabled || busy) return;
    const action = b.dataset.action, value = b.dataset.value, id = b.dataset.id;
    try {
      if (action === 'auth-mode' || action === 'auth-back') return await resetAuthMode(action === 'auth-mode' ? value : 'login');
      if (action === 'forgot') { authMode = 'recovery'; authStep = 'details'; authError = ''; return render(); }
      if (action === 'retry') { if (connected && authUser) return await sync(); return await initialize(); }
      if (action === 'logout') {
        const {error} = await sb.auth.signOut({scope:'local'}); if (error) throw error;
        authUser = null; state = null; epoch++; drafts.clear(); authFlow = false; loading = false; screenError = ''; authError = ''; authMode = 'login'; authStep = 'details'; pending = null;
        status('Supabase authentication connected · Sign in to load your live account records.',true); render(); return;
      }
      if (action === 'resend') {
        busy = true; b.disabled = true; await sendPendingCode(); toast('A new verification code was requested. Check your email.'); return;
      }
      if (!me()) throw new Error('Sign in and load your account to continue.');
      if (action === 'nav') {
        page = value; search = ''; ack = false; render(); window.scrollTo({top:0,behavior:'instant'});
        if (page === 'account') { await rpc('cr_mark_messages_read',{}); await sync(); }
        if (page === 'referral' && me()?.role !== 'admin') await loadReferrals();
      } else if (action === 'refresh') { await sync(); if (page === 'referral' && me()?.role !== 'admin') await loadReferrals(); if (state) toast('Live records refreshed.'); }
      else if (action === 'load-referrals') await loadReferrals();
      else if (action === 'amount') { depositAmount = Number(value); render(); }
      else if (action === 'network') { network = value; ack = false; render(); }
      else if (action === 'withdraw-type') { withdrawType = value; ack = false; render(); }
      else if (action === 'capital') { page = 'withdraw'; withdrawType = 'capital'; ack = false; render(); }
      else if (action === 'ack') openAck();
      else if (action === 'understand') { ack = true; $('modal').close(); render(); }
      else if (action === 'copy-wallet') { if (!ack || !state.wallets[network]) throw new Error('Confirm the network before copying an address.'); await copy(state.wallets[network]); }
      else if (action === 'copy-value') await copy(value);
      else if (action === 'copy-referral') await copy(`${location.origin}${location.pathname}?ref=${encodeURIComponent(authUser.id)}`);
      else if (action === 'ban') {
        if (me().role !== 'admin') throw new Error('Administrator access required.');
        const target = findUser(id); if (!target || target.role === 'admin') throw new Error('This account cannot be banned.');
        modal(target.banned ? 'Restore user access?' : 'Ban this user?',`<p class="text-sm text-muted leading-relaxed">${esc(target.name)}: ${target.banned ? 'Restore access and resume accrual from now. Banned days are not credited.' : 'Block Supabase sign-in, deposits, withdrawals, messages, and daily accrual. Existing balances and history remain saved.'}</p><form id="ban-form" data-record="${id}" data-ban="${!target.banned}" class="mt-5"><button class="${primary} w-full">${target.banned ? 'Unban User' : 'Ban User'}</button></form>`);
      } else if (['approve-deposit','reject-deposit','approve-withdrawal','reject-withdrawal'].includes(action)) confirmFinancialAction(action,id);
    } catch (error) { console.error('Action failed:',error.message); toast(error.message); }
    finally { busy = false; if (b.isConnected) b.disabled = false; }
  });
  document.addEventListener('change',e => { captureDraft(e.target); });
  function captureDraft(field) {
    const form = field.closest('form[data-draft]'); if (!form || !field.name || field.readOnly || field.type === 'password') return;
    drafts.set(form.dataset.draft,{...(drafts.get(form.dataset.draft) || {}),[field.name]:field.value});
  }
  document.addEventListener('input',e => {
    captureDraft(e.target);
    if (e.target.id === 'withdraw-amount') updateWithdrawalPreview();
    if (e.target.id === 'search') { search = e.target.value; render(); $('search')?.focus(); }
  });
  document.addEventListener('submit',async e => {
    e.preventDefault(); if (busy) return;
    const form = e.target, fd = new FormData(form), button = form.querySelector('button[type="submit"],button:not([type])');
    busy = true; const oldText = button?.textContent;
    if (button) { button.disabled = true; button.textContent = 'Please wait…'; } form.setAttribute('aria-busy','true');
    const isAuth = ['auth-form','verify-form','recovery-form'].includes(form.id);
    try {
      if (!sb || !connected) throw new Error('Supabase is not connected. Retry the connection; no offline authentication is available.');
      if (form.id === 'auth-form') {
        authError = '';
        if (authMode === 'login') {
          authFlow = true;
          const tokens = await edge('account-access',{identity:String(fd.get('identity')).trim(),password:fd.get('password')});
          const {data,error} = await sb.auth.setSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token});
          if (error) throw error;
          pending = null; authFlow = false; await activate(data.session);
        } else {
          const normalizedPhone = phone(fd.get('phone')), name = String(fd.get('name')).trim(), email = String(fd.get('email')).trim().toLowerCase();
          if (!name) throw new Error('Enter your full name.');
          if (!isPhone(normalizedPhone)) throw new Error('Enter an international phone number beginning with + and country code.');
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 254) throw new Error('Enter a valid email address to receive your verification code.');
          const referrer = query.get('ref');
          pending = {kind:'signup',method:'email',target:email,verified:false,metadata:{full_name:name,phone:normalizedPhone,country:fd.get('country'),password_ready:false,...(referrer && /^[0-9a-f-]{36}$/i.test(referrer) ? {referrer} : {})}};
          authFlow = true; await sendPendingCode(); authStep = 'verify'; render();
        }
      } else if (form.id === 'recovery-form') {
        const target = String(fd.get('identity')).trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(target)) throw new Error('Enter the email address verified when creating your account.');
        pending = {kind:'recovery',method:'email',target,verified:false}; authFlow = true; authError = '';
        await sendPendingCode(); authStep = 'verify'; render();
      } else if (form.id === 'verify-form') {
        if (!pending) throw new Error('Start account verification again.');
        if (!pending.verified) {
          if (pending.method !== 'email') throw new Error('Start email verification again.');
          const params = {email:pending.target,token:String(fd.get('code')).trim(),type:pending.kind === 'recovery' ? 'recovery' : 'email'};
          const {data,error} = await sb.auth.verifyOtp(params); if (error) throw error;
          if (!data.session || !data.user) throw new Error('Supabase did not return a verified session.');
          pending.verified = true; authUser = data.user; authStep = 'password';
        }
        const {error} = await sb.auth.updateUser({password:String(fd.get('password')),data:{password_ready:true}}); if (error) throw error;
        const {data:sessionData,error:sessionError} = await sb.auth.getSession(); if (sessionError) throw sessionError;
        if (!sessionData.session) throw new Error('Your verification session expired. Start verification again.');
        pending = null; authFlow = false; authError = ''; authStep = 'details'; await activate(sessionData.session); if (state) toast('Your password is saved and your account is signed in.');
      } else {
        const u = me(); if (!u || u.banned) throw new Error('Your account is unavailable. Sign in again or contact Admin.');
        if (form.id === 'deposit-form') {
          if (!ack || !state.wallets[network]) throw new Error('Confirm the network and verify a configured deposit address.');
          const proof = String(fd.get('proof')).trim(); if (proof.length < 8 || proof.length > 500) throw new Error('Enter a transaction hash or proof of 8–500 characters.');
          await rpc('cr_request_deposit',{p_amount:depositAmount,p_network:network,p_proof:proof}); drafts.delete(form.dataset.draft); ack = false; await afterWrite('Deposit submitted to Supabase. Awaiting admin review.');
        } else if (form.id === 'withdraw-form') {
          if (!ack) throw new Error('Confirm the network safety notice.');
          const address = String(fd.get('address')).trim(), amount = Number(fd.get('amount'));
          if (!validAddress(network,address)) throw new Error('The address format does not match the chosen network.');
          if (!Number.isFinite(amount) || amount <= 0 || Math.abs(amount * 100 - Math.round(amount * 100)) > .000001) throw new Error('Enter a valid amount with no more than two decimal places.');
          await rpc('cr_request_withdrawal',{p_type:withdrawType,p_network:network,p_address:address,p_amount:amount}); drafts.delete(form.dataset.draft); ack = false; await afterWrite('Withdrawal submitted. No balance is deducted until approval.');
        } else if (form.id === 'message-form') {
          const body = String(fd.get('text')).trim(); if (!body) throw new Error('Enter a message.');
          await rpc('cr_send_message',{p_body:body}); drafts.delete(form.dataset.draft); await afterWrite('Your private message was sent to Admin.');
        } else if (form.id === 'profile-form') {
          const name = String(fd.get('name')).trim(); if (!name) throw new Error('Enter your name.');
          const {data,error} = await sb.from('profiles').update({full_name:name,country:fd.get('country')}).eq('id',u.id).select('id'); if (error) throw error;
          if (!data?.length) throw new Error('Your profile was not updated. Check account permissions.');
          drafts.delete(form.dataset.draft); await afterWrite('Your profile was saved to Supabase.');
        } else if (form.id === 'wallet-form') {
          if (u.role !== 'admin') throw new Error('Administrator access required.');
          const bsc = String(fd.get('BSC')).trim(), trx = String(fd.get('TRX')).trim();
          if (!validAddress('BSC',bsc) || !validAddress('TRX',trx)) throw new Error('One of the addresses does not match its network.');
          await rpc('cr_set_wallet',{p_network:'BSC',p_address:bsc});
          try { await rpc('cr_set_wallet',{p_network:'TRX',p_address:trx}); }
          catch (error) { await sync(); throw new Error(`BSC was saved, but TRX was not: ${error.message}`); }
          drafts.delete(form.dataset.draft); await afterWrite('Both deposit wallet addresses were saved to Supabase.');
        } else if (form.dataset.reply) {
          if (u.role !== 'admin') throw new Error('Administrator access required.');
          const reply = String(fd.get('reply')).trim(); if (!reply) throw new Error('Enter your reply.');
          await rpc('cr_reply_message',{p_id:form.dataset.reply,p_reply:reply}); drafts.delete(form.dataset.draft); await afterWrite('Reply saved for this user only.');
        } else if (form.id === 'process-form') {
          if (u.role !== 'admin') throw new Error('Administrator access required.');
          const operation = form.dataset.operation, deposit = operation.includes('deposit'), approve = operation.startsWith('approve');
          await rpc(deposit ? 'cr_process_deposit' : 'cr_process_withdrawal',{p_id:form.dataset.record,p_approve:approve});
          $('modal').close(); await afterWrite(`${deposit ? 'Deposit' : 'Withdrawal'} ${approve ? 'approved' : 'rejected'}. ${approve ? 'Balances updated by the server.' : 'Balances unchanged.'} Request removed from pending lists.`);
        } else if (form.id === 'ban-form') {
          if (u.role !== 'admin') throw new Error('Administrator access required.');
          const result = await edge('admin-ban-user',{user_id:form.dataset.record,banned:form.dataset.ban === 'true'}); $('modal').close(); await afterWrite(result.warning || (result.banned ? 'User banned. Balances and history retained; accrual stopped.' : 'User access restored. Accrual resumes from now.'));
        }
      }
    } catch (error) {
      console.error('Supabase operation failed:',error.message);
      if (isAuth) {
        authError = error.message || 'Unable to complete authentication.';
        if (form.id === 'auth-form' && authMode === 'login') authFlow = false;
        if (pending?.verified) { authStep = 'password'; render(); }
        else {
          const errorElement = document.createElement('div'); errorElement.setAttribute('role','alert'); errorElement.className = 'rounded-xl border border-red-400/30 bg-red-400/5 p-4 mb-5 text-sm text-red-200 whitespace-pre-wrap'; errorElement.textContent = authError;
          form.parentElement.querySelector('[role="alert"]')?.remove(); form.before(errorElement);
        }
      } else toast(error.message || 'Unable to complete the operation.');
    } finally {
      busy = false; form.removeAttribute('aria-busy'); if (button?.isConnected) { button.disabled = false; button.textContent = oldText; }
    }
  });
  // Refresh real records; never calculate or write earnings from the browser.
  const poll = setInterval(async () => {
    if (document.hidden || busy || authFlow || !authUser || !state || $('modal').open) return;
    await sync(true); if (page === 'referral' && me()?.role !== 'admin') await loadReferrals();
  },10000);
  document.addEventListener('visibilitychange',() => { if (!document.hidden && authUser && !authFlow && !busy && !$('modal').open) void sync(true); });
  if (broadcast) broadcast.onmessage = e => { if (e.data?.type === 'refresh' && authUser && !authFlow && !busy && !$('modal').open) void sync(true); };
  window.addEventListener('pagehide',() => { clearInterval(poll); broadcast?.close(); });
  void initialize();
});
</script>
<script>window.onload=function(){var d=document.createElement("div");d.id="appLoadFinished";document.body.appendChild(d);};</script>
