async function initialize(){screenError='';render();try{if(!sb){if(!window.supabase?.createClient)throw new Error('Account services could not load. Check your internet connection and retry.');sb=window.supabase.createClient(SUPABASE_URL,PUBLIC_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});sb.auth.onAuthStateChange((event,session)=>{const version=epoch;setTimeout(async()=>{if(version!==epoch||authFlow||!connected)return;try{if(event==='SIGNED_OUT'){clearAccount();render();}else if(event==='PASSWORD_RECOVERY')await activate(session,true);else if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED')&&session){if(user?.id===session.user.id&&data){user=session.user;return;}await activate(session);}}catch(e){screenError=errorText(e.message);render();}},0);});}
 void loadPublic();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);let response;try{response=await fetch(`${SUPABASE_URL}/auth/v1/settings`,{headers:{apikey:PUBLIC_KEY},signal:controller.signal});config=await response.json();if(!response.ok)throw new Error(config.message||config.msg||'Authentication settings unavailable.');}finally{clearTimeout(timer);}connected=true;const{data:sessionData,error}=await sb.auth.getSession();if(error)throw error;const callbackError=q.get('error_description')||hash.get('error_description');if(callbackError){authError=callbackError;history.replaceState({},document.title,location.pathname);}if(sessionData.session&&!authFlow)await activate(sessionData.session,q.get('type')==='recovery'||hash.get('type')==='recovery');else render();}catch(e){connected=false;loading=false;screenError=e.name==='AbortError'?'Account services did not respond within 15 seconds. Please retry.':errorText(e.message);render();}}

function getProgress(id){if(progressCache.has(id))return progressCache.get(id);let p={id,elapsed:0,duration:0,done:false,paused:false,reason:''};try{const saved=JSON.parse(localStorage.getItem(movingKey)||'null');if(saved?.id===id&&Number.isFinite(saved.elapsed)&&saved.elapsed>=0&&Number.isFinite(saved.duration)&&saved.duration>=45000)p={...p,...saved};}catch{}progressCache.set(id,p);return p;}
function saveProgress(){if(!playback)return;if(playback.animation&&!playback.p.done){const elapsed=Number(playback.animation.currentTime);if(Number.isFinite(elapsed))playback.p.elapsed=Math.max(0,Math.min(elapsed,playback.p.duration*2));}try{localStorage.setItem(movingKey,JSON.stringify(playback.p));}catch{}}
function stopPlayback(){if(!playback)return;saveProgress();clearInterval(playback.timer);if(playback.animation){playback.animation.onfinish=null;playback.animation.cancel();}playback=null;}
function movingBanner(){if(!moving)return '';const p=getProgress(moving.id);if(!admin()&&p.done&&p.reason==='complete')return '';const image=secureUrl(moving.image_url),link=secureUrl(moving.link_url);return `<section id="moving-banner" aria-label="Announcement" class="${card} mb-7 overflow-hidden border-gold/30">${admin()&&page==='moving-adverts'?`<div class="flex flex-wrap justify-between items-center gap-3 p-4 border-b border-line"><span id="moving-status" class="text-xs text-muted">Two slow passes, then hidden from users</span>${btn('moving-toggle',p.paused?'Resume':'Pause')}</div>`:''}<div class="flex gap-4 px-5">${image?`<img src="${esc(image)}" alt="Image accompanying ${esc(moving.title)}" loading="lazy" decoding="async" class="my-4 h-16 w-16 shrink-0 object-contain rounded-lg">`:''}<div id="moving-lane" class="flex-1 min-w-0 overflow-hidden"><p id="moving-accessible" class="sr-only">${esc(moving.title)}. ${esc(moving.message)}</p><div id="moving-track" aria-hidden="true" class="inline-flex w-max items-baseline gap-6 py-4 whitespace-nowrap will-change-transform"><strong class="font-display text-base">${esc(moving.title)}</strong><span class="text-gold">—</span><span class="text-sm">${esc(moving.message.replace(/\s+/g,' '))}</span></div></div></div>${link?`<div class="px-5 pb-4"><a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="text-gold text-sm inline-flex min-h-11 items-center">Learn more</a></div>`:''}</section>`;}
function finishPlayback(reason='complete'){if(!playback)return;const s=playback;s.p.done=true;s.p.reason=reason;if(reason==='complete')s.p.elapsed=s.p.duration*2;if(s.animation){s.animation.onfinish=null;s.animation.cancel();s.animation=null;}clearInterval(s.timer);saveProgress();if(!admin()&&reason==='complete')$('moving-banner')?.classList.add('hidden');else{const track=$('moving-track');if(track){track.className='py-4';track.removeAttribute('aria-hidden');track.innerHTML=`<strong>${esc(moving.title)}</strong><p class="text-sm leading-relaxed whitespace-pre-wrap mt-3 break-words">${esc(moving.message)}</p>`;$('moving-accessible')?.classList.add('hidden');}if($('moving-status'))$('moving-status').textContent=reason==='complete'?'Completed 2 passes in this browser':'Stationary announcement';}}
function updatePlayback(){const s=playback;if(!s||s.p.done)return;if(reducedMotion.matches){finishPlayback('reduced-motion');return;}if(s.animation){const paused=s.p.paused||s.hover||document.hidden||!popup.classList.contains('hidden');if(paused)s.animation.pause();else s.animation.play();const b=document.querySelector('[data-action="moving-toggle"]');if(b)b.textContent=s.p.paused?'Resume':'Pause';if($('moving-status'))$('moving-status').textContent=paused?'Paused · two slow passes':`Pass ${Math.min(2,Math.floor((Number(s.animation.currentTime)||0)/s.p.duration)+1)} of 2`;}}
function mountPlayback(){const track=$('moving-track'),lane=$('moving-lane');if(!moving||!track||!lane)return;const p=getProgress(moving.id);if(!admin())p.paused=false;const s={p,animation:null,timer:null,hover:false};playback=s;if(p.done){finishPlayback(p.reason||'complete');return;}if(reducedMotion.matches){finishPlayback('reduced-motion');return;}if(typeof track.animate!=='function'){finishPlayback('unavailable');return;}lane.addEventListener('mouseenter',()=>{if(playback===s){s.hover=true;updatePlayback();}});lane.addEventListener('mouseleave',()=>{if(playback===s){s.hover=false;updatePlayback();}});const start=()=>{if(playback!==s||!track.isConnected)return;const w=lane.clientWidth,t=track.scrollWidth;if(!w||!t){finishPlayback('unavailable');return;}if(!p.duration)p.duration=Math.max(45000,Math.ceil((w+t)/28*1000));if(p.elapsed>=p.duration*2){finishPlayback();return;}s.animation=track.animate([{transform:`translateX(${w}px)`},{transform:`translateX(-${t}px)`}],{duration:p.duration,iterations:2,easing:'linear'});s.animation.pause();s.animation.currentTime=p.elapsed;s.animation.onfinish=()=>{if(playback===s)finishPlayback();};updatePlayback();s.timer=setInterval(()=>{if(playback===s){saveProgress();updatePlayback();}},2000);};if(document.fonts?.ready)document.fonts.ready.then(()=>requestAnimationFrame(start)).catch(()=>requestAnimationFrame(start));else requestAnimationFrame(start);}
async function loadPublic(){if(!sb||publicJob)return;publicJob=true;try{const[a,m,{data:c,error}]=await Promise.all([records('advertisements'),records('moving_advertisements'),sb.from('cr_company_settings').select('contact_number,phone_enabled,telegram_url,telegram_enabled').eq('singleton',true).single()]);if(error)throw error;const latest=m[0]||null,changed=JSON.stringify([ads,moving,company])!==JSON.stringify([a,latest,c]);ads=a;moving=latest;company=c;publicError='';if(changed&&!busy&&!document.activeElement?.closest('form')&&!$('modal').open)render();}catch(e){publicError='Company announcements or contacts could not be loaded. Please refresh to retry.';console.error('Public content:',e.message);}finally{publicJob=null;}}

document.addEventListener('error',e=>{if(!(e.target instanceof HTMLImageElement))return;const i=e.target.dataset.coinIndex;if(i!==undefined){const c=coins[Number(i)],n=Number(e.target.dataset.fallback||0)+1;e.target.dataset.fallback=String(n);if(c&&n<c.sources.length)e.target.src=c.sources[n];else e.target.classList.add('hidden');}else e.target.classList.add('hidden');},true);

async function refreshMarket(){if(marketJob||!user||!data||authFlow||!$('crList'))return;if(document.hidden){scheduleMarket();return;}const version=epoch,id=user.id,job={};marketJob=job;marketLastRequest=Date.now();try{const result=await edge('market-prices');if(version!==epoch||user?.id!==id)return;if(result.source!=='CoinGecko'||!Array.isArray(result.quotes)||!result.quotes.length)throw new Error('Market provider returned no quotes.');for(const c of coins){const quote=result.quotes.find(q=>q.id===c.id);c.price=Number.isFinite(quote?.price)&&quote.price>0?quote.price:null;c.pct=Number.isFinite(quote?.change_24h)?quote.change_24h:null;c.updatedAt=Number.isFinite(quote?.updated_at)?quote.updated_at:null;}marketCached=result.stale===true;marketError='';}catch(e){if(version!==epoch||user?.id!==id)return;marketError=errorText(e.message);console.error('Market prices:',e.message);}finally{if(marketJob===job)marketJob=null;if(version===epoch&&user?.id===id){marketAttempted=true;paintMarket();scheduleMarket();}}}

 else if(kind==='capital-release'){result=await rpc('cr_release_category_capital',{p_category_id:id,p_reason:text('reason'),p_confirmed:confirmed});message='Eligible memberships closed and released capital recorded. New withdrawals require an active funded trade.';}
 else if(kind==='company'){if(!can('company_settings'))throw new Error('Company settings permission required.');await rpc('cr_save_company_settings',{p_phone:text('phone')||null,p_phone_enabled:fd.has('phone_enabled'),p_telegram:text('telegram')||null,p_telegram_enabled:fd.has('telegram_enabled'),p_payment_instructions:text('instructions')});message='Company contacts and payment instructions saved.';void loadPublic();}
 else if(kind==='agent'){if(!confirmed)throw new Error('Confirm the designation change.');await rpc('cr_set_agent',{p_user_id:id,p_agent:text('agent')==='true'});message='Private account designation saved.';}
 else if(kind==='permissions'){await rpc('cr_set_staff_permissions',{p_user_id:id,p_permissions:fd.getAll('permission')});message='Staff permissions saved.';}
 else if(kind==='member-notification'){await rpc('cr_send_member_notification',{p_user_id:id,p_subject:text('subject'),p_message:text('body')});message='Member notification sent.';}
 else if(kind==='support-new'||kind==='support-reply'){bucket='cr-support-files';uploaded=await uploadFiles(fd,bucket,3);result=kind==='support-new'?await rpc('cr_create_support_ticket',{p_subject:text('subject'),p_topic:text('topic'),p_body:text('body'),p_files:uploaded}):await rpc('cr_support_send_message',{p_ticket_id:id,p_body:text('body'),p_files:uploaded});committed=true;ticketId=result?.ticket_id||id;page='care';message=kind==='support-new'?'Private support ticket submitted.':'Private reply sent.';}
 else if(kind==='ticket-update'){if(!can('customer_care'))throw new Error('Customer care permission required.');await rpc('cr_update_support_ticket',{p_ticket_id:id,p_status:text('status'),p_assigned_to:text('assigned')||null});message='Support ticket updated.';}
 else if(kind==='profile'){const{data:saved,error}=await sb.from('profiles').update({full_name:text('name'),country:text('country')}).eq('id',user.id).select('id');if(error)throw error;if(!saved?.length)throw new Error('Profile update was not confirmed.');message='Profile saved.';}
 else if(kind==='ban'){const result=await edge('admin-ban-user',{user_id:id,banned:text('banned')==='true'});message=result.warning||(result.banned?'User banned. History retained.':'User access restored.');}
 else if(kind==='wallets'){const bsc=text('BSC'),trx=text('TRX');if(!validAddress('BSC',bsc)||!validAddress('TRX',trx))throw new Error('A wallet address does not match its network.');await rpc('cr_set_wallet',{p_network:'BSC',p_address:bsc});try{await rpc('cr_set_wallet',{p_network:'TRX',p_address:trx});}catch(e){await sync();throw new Error(`BSC was saved, but TRX was not: ${e.message}`);}message='Both deposit wallet addresses saved.';}
 else if(kind==='admin-login'){const email=text('email').toLowerCase(),current=String(fd.get('current_password')),password=String(fd.get('new_password'));if(!validEmail(email))throw new Error('Enter a valid email address.');if(password.length<8||password.length>1024)throw new Error('Use a password between 8 and 1,024 characters.');if(password!==String(fd.get('confirm_password')))throw new Error('The new passwords do not match.');if(password===current)throw new Error('Choose a different password.');authFlow=true;try{result=await edge('account-access',{action:'change-admin-login',email,current_password:current,new_password:password});if(result.user_id!==user.id||result.role!=='admin'||result.password_updated!==true)throw new Error('Administrator update was not confirmed.');if(result.access_token&&result.refresh_token){const{data:session,error}=await sb.auth.setSession({access_token:result.access_token,refresh_token:result.refresh_token});if(error||!session.session)throw new Error('Your password was saved, but the session could not refresh. Sign in with your new password.');authFlow=false;await activate(session.session);}else{authFlow=false;await logout();}clearPasswords(f);modal('Administrator login updated',`<p class="text-sm leading-relaxed">${esc(result.email_confirmation_pending?'Your new password is saved. Confirm the email-change instructions in your current and new inboxes. Until confirmed, use your current email and new password.':result.email_change_requested?'Your new password is saved. Use your updated email once the email change is confirmed.':'Your new password is saved. Your administrator email is unchanged.')}</p><p class="text-xs text-muted leading-relaxed mt-4">Your existing account, administrator role, investment records, and history are preserved. Already-issued tokens may remain valid until expiry.</p>${result.warning?`<p class="text-sm text-amber-200 mt-4">${esc(errorText(result.warning))}</p>`:''}`);return;}finally{authFlow=false;}}
 else if(kind==='advert'||kind==='moving-advert'){const checked=await verify();if(checked.user_id!==user.id||checked.role!=='admin')throw new Error('Administrator permissions could not be verified.');const title=text('title'),messageBody=text('message'),image=secureUrl(text('image')),link=secureUrl(text('link'));if(!title||title.length>120||!messageBody||messageBody.length>2000)throw new Error('Enter a valid title and message.');if(text('image')&&!image||text('link')&&!link)throw new Error('Use valid HTTPS image and website links.');const{data:saved,error}=await sb.from(kind==='moving-advert'?'moving_advertisements':'advertisements').insert({title,message:messageBody,image_url:image||null,link_url:link||null,created_by:user.id}).select('*').single();if(error)throw error;if(!saved?.id)throw new Error('Publishing was not confirmed. Refresh before retrying.');if(kind==='moving-advert')moving=saved;else ads=[saved,...ads];message=kind==='moving-advert'?'Moving advert published. Users see two slow passes, then it disappears.':'Stationary advert published.';}
 else if(kind==='delete-advert'){const{data:removed,error}=await sb.from('advertisements').delete().eq('id',id).select('id');if(error)throw error;if(!removed?.length)throw new Error('Advert already removed, or permission denied.');ads=ads.filter(a=>a.id!==id);message='Stationary advert removed.';}
 else throw new Error('This form is unavailable.');
 committed=true;if(f.dataset.draft)drafts.delete(f.dataset.draft);if(f.closest('dialog'))$('modal').close();await afterWrite(message);if(['advert','moving-advert','delete-advert'].includes(kind))void loadPublic();
}catch(e){console.error('Operation:',e.message);if(!committed)await cleanFiles(bucket,uploaded);if(['auth','recovery','verify'].includes(kind)){authError=e.message;if(kind==='auth'&&!pending?.verified){authFlow=false;pending=null;}if(kind==='verify'&&pending?.verified){render();}else if(!f.isConnected)render();}if(f.isConnected){const alert=f.querySelector('[data-form-error]');if(alert){alert.textContent=errorText(e.message);alert.classList.remove('hidden');alert.scrollIntoView({block:'nearest'});}else toast(e.message);}else toast(e.message);}finally{if(kind==='admin-login')clearPasswords(f);busy=false;f.removeAttribute('aria-busy');if(button?.isConnected){button.disabled=false;button.textContent=old;}}});
// Polling is scoped, preserves active forms, and revalidates roles on every account refresh.
const poll=setInterval(()=>{if(document.hidden||busy)return;void loadPublic();if(!authFlow&&!$('modal').open&&popup.classList.contains('hidden')&&user&&data)void sync(true);},10000);
document.addEventListener('visibilitychange',()=>{updatePlayback();saveProgress();if(!document.hidden&&!busy){void loadPublic();if(user&&!authFlow&&!$('modal').open)void sync(true);marketTick();}});
if(broadcast)broadcast.onmessage=e=>{if(e.data?.type!=='refresh'||busy)return;void loadPublic();if(user&&!authFlow&&!$('modal').open)void sync(true);};
if(reducedMotion.addEventListener)reducedMotion.addEventListener('change',updatePlayback);else reducedMotion.addListener?.(updatePlayback);
window.addEventListener('storage',e=>{if(e.key!==movingKey||!e.newValue||!playback||playback.p.done)return;try{const saved=JSON.parse(e.newValue);if(saved.id===playback.p.id&&saved.done)finishPlayback(['complete','reduced-motion','unavailable'].includes(saved.reason)?saved.reason:'complete');}catch{}});
window.addEventListener('pageshow',()=>{updatePlayback();if($('crList'))marketTick();});
window.addEventListener('pagehide',e=>{saveProgress();if(!e.persisted){stopPlayback();clearTimeout(marketTimer);marketTimer=null;clearInterval(poll);broadcast?.close();}});
void initialize();
});
